name: Kalshi High-Probability Trading Bot

on:
  schedule:
    # Runs every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - paper
      environment:
        description: 'Kalshi API Environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - demo

jobs:
  trade-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: |
          python -m pytest

      - name: Execute Trading Cycle
        env:
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          KALSHI_ENV: ${{ github.event.inputs.environment || secrets.KALSHI_ENV || 'prod' }}
        run: |
          MODE="${{ github.event.inputs.mode || 'live' }}"
          echo "Executing Kalshi Trading Bot in $MODE mode on $KALSHI_ENV..."
          python main.py bot --mode "$MODE"
